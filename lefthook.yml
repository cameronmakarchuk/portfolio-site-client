# https://lefthook.dev/configuration/
pre-commit:
  commands:
    biome:
      glob: "*.{js,ts,jsx,tsx,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      # `-b` is required: the root tsconfig.json only holds project references, so plain `tsc` checks nothing.
      run: npx tsc -b
