<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
	<text x="8" y="18" class="meta">One request, start to finish</text>

	<text x="8" y="50" class="meta">01</text>
	<text x="40" y="50" class="title">Client asks</text>
	<text x="40" y="67" class="body">“A 30-minute walk for Charlie, Sunday 12–1”</text>
	<text x="392" y="50" class="tag mint" text-anchor="end">CLIENT</text>
	<line x1="8" y1="80" x2="392" y2="80" class="rule"/>

	<text x="8" y="104" class="meta">02</text>
	<text x="40" y="104" class="title">Team builds a care plan</text>
	<text x="40" y="121" class="body">Recommended caregiver, no schedule conflicts</text>
	<text x="392" y="104" class="tag" fill="#8c8596" text-anchor="end">ADMIN</text>
	<line x1="8" y1="134" x2="392" y2="134" class="rule"/>

	<text x="8" y="158" class="meta">03</text>
	<text x="40" y="158" class="title">Client confirms</text>
	<text x="40" y="175" class="body">Caregiver, time, place and price in one review</text>
	<text x="392" y="158" class="tag mint" text-anchor="end">CLIENT</text>
	<line x1="8" y1="188" x2="392" y2="188" class="rule"/>

	<text x="8" y="212" class="meta">04</text>
	<text x="40" y="212" class="title">Caregiver visits</text>
	<text x="40" y="229" class="body">Live timer, checklist and photos</text>
	<text x="392" y="212" class="tag" fill="#8c8596" text-anchor="end">CAREGIVER</text>
	<line x1="8" y1="242" x2="392" y2="242" class="rule"/>

	<text x="8" y="266" class="meta coral">05</text>
	<text x="40" y="266" class="title">Charged after the visit</text>
	<text x="40" y="283" class="body">Invoice goes out once the walk is complete</text>
	<text x="392" y="266" class="tag coral" text-anchor="end">BILLING</text>
</svg>
